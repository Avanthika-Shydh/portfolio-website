<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Avanthika Shydh | Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Portfolio of Avanthika Shydh - Dual-degree undergraduate specializing in AI-driven perception systems, embedded systems, and data science." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="style.css?v=1.1" />
  <link rel="icon" type="image/svg+xml" href="assets/avi/favicon.svg">
  <link rel="stylesheet" href="splash.css?v=1.1" />
  <link rel="stylesheet" href="contact.css?v=1.1" />
</head>

<body>

  <!-- SPLASH SCREEN -->
  <div id="splash-screen">
    <div class="splash-content">
      <div class="splash-logo">Avanthika Shydh</div>
      <p class="splash-tagline">Building Intelligent Systems</p>
      <div class="loading-bar">
        <div class="loading-progress"></div>
      </div>
    </div>
  </div>

  <!-- Sections Container -->
  <div id="navbar-container"></div>
  <div id="hero-container"></div>
  <div class="divider"></div>
  <div id="about-container"></div>
  <div id="skills-container"></div>
  <div id="education-container"></div>
  <div id="certifications-container"></div>
  <div id="projects-container"></div>
  <div id="faq-container-main"></div>
  <div id="contact-container-main"></div>
  <div id="footer-container"></div>

  <!-- MODALS (Keep in index for global access logic) -->
  <div class="modal-overlay" id="projectModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Project Title</h3>
        <button type="button" class="close-modal-btn" id="closeModalBtn" title="Close Modal" aria-label="Close Modal">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="modal-gallery">
        <img
          id="modalProjectImage"
          class="project-image"
          alt=""
        />
      </div>
        <p class="modal-description" id="modalDescription">Description goes here...</p>
        <h4 class="modal-subtitle">Technologies Used</h4>
        <ul class="modal-tech-list" id="modalTechList">
        </ul>
      </div>
    </div>
  </div>

  <button id="scrollToTopBtn" aria-label="Scroll to top">
    <i class="fas fa-arrow-up"></i>
  </button>

  <div class="modal-overlay" id="resumeModal">
    <div class="modal-content resume-modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Resume Preview</h3>
        <button type="button" class="close-modal-btn" onclick="closeResumePreview()" aria-label="Close Modal">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body resume-body">
        <iframe src="assets/avi/resume.pdf" class="resume-frame" title="Resume PDF"></iframe>
        <div class="resume-actions">
          <a href="assets/avi/resume.pdf" class="btn-primary" download>
            <i class="fas fa-download"></i> Download PDF
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- LOAD SCRIPTS -->
  <script src="script.js?v=1.1"></script>

</body>

</html>
